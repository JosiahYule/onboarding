<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17171a" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Employee onboarding for Integrated Staffing, Accountant Staffing and Administrative Staffing."
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Integrated Launch</title>
    <script>
      // Apply a saved light/dark choice before first paint, so someone who
      // picked dark doesn't see a white flash while the app loads.
      // Mirrors apply() in src/hooks/useTheme.js.
      try {
        var t = localStorage.getItem('il-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <style>
      html, body { background: #ffffff; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #17171a; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #17171a; }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 420px; margin: 20vh auto; padding: 0 20px; text-align: center; color: #70706b;">
        Integrated Launch needs JavaScript. Please enable it in your browser settings and reload the page.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
